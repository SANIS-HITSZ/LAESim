site_name: LAESim 中文文档
site_url: https://sanis-hitsz.github.io/LAESim/
site_author: 哈尔滨工业大学（深圳）广东省空天网络与智能感知实验室
site_dir: build_docs
repo_url: https://github.com/SANIS-HITSZ/LAESim
edit_uri: edit/V1.4/docs/
site_description: '支持空天地海混合载具、SceneMap 与可选 ns-3 自组网的多机仿真平台'

markdown_extensions:
  - toc:
      permalink: "#"
  - pymdownx.extra
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - admonition

# The repository retains upstream AirSim documents for source compatibility,
# but the LAESim site publishes only the curated product documentation below.
exclude_docs: |
  *
  !index.md
  !documentation.md
  !laesim_features.md
  !laesim_build.md
  !laesim_use.md
  !laesim_wsl_ros_ns3.md
  !simulation_cases.md
  !assets/
  !assets/**
  includes/
  includes/**
  !css/
  !css/**
  !js/
  !js/**
  !img/
  !img/**
  !stylesheets/
  !stylesheets/laesim.css
  !stylesheets/landing.css

remote_branch: gh-pages

theme:
  name: readthedocs
  custom_dir: theme_overrides
  locale: zh_CN
  include_homepage_in_sidebar: true
  prev_next_buttons_location: bottom
  navigation_depth: 4
  titles_only: false
  sticky_navigation: true
  collapse_navigation: true
  highlightjs: true
  hljs_style: github

extra:
  version: main

extra_css:
  - stylesheets/laesim.css

copyright: 哈尔滨工业大学（深圳）广东省空天网络与智能感知实验室；LAESim contributors；基于 Microsoft AirSim

nav:
  - "首页": index.md
  - "文档":
      - "文档概览": documentation.md
      - "核心特色": laesim_features.md
      - "安装与构建 LAESim": laesim_build.md
      - "使用 LAESim": laesim_use.md
  - "仿真案例":
      - "案例概览": simulation_cases.md
  - "上游参考":
      - "AirSim 官方文档": https://microsoft.github.io/AirSim/
      - "AirSim API 文档": https://microsoft.github.io/AirSim/apis/
      - "ns-3 官方文档": https://www.nsnam.org/documentation/
  - "项目":
      - "GitHub 仓库": https://github.com/SANIS-HITSZ/LAESim/tree/V1.4
      - "团队与联系": https://github.com/SANIS-HITSZ/LAESim/blob/V1.4/CONTRIBUTORS.md
      - "引用 LAESim": https://github.com/SANIS-HITSZ/LAESim/blob/V1.4/CITATION.cff
      - "提交问题": https://github.com/SANIS-HITSZ/LAESim/issues
      - "更新记录": https://github.com/SANIS-HITSZ/LAESim/blob/V1.4/CHANGELOG.md
