site_name: LAESim 中文文档
site_url: https://sanis-hitsz.github.io/LAESim/
site_author: SANIS-HITSZ
site_dir: build_docs
repo_url: https://github.com/SANIS-HITSZ/LAESim
edit_uri: edit/main/docs/
site_description: '支持空地海混合载具与可选 ns-3 自组网的多机仿真平台'

markdown_extensions:
  - toc:
      permalink: "#"
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.extra
  - admonition

# The repository retains upstream AirSim documents for source compatibility,
# but the LAESim site publishes only the curated product documentation below.
exclude_docs: |
  *
  !index.md
  !laesim_features.md
  !laesim_build.md
  !laesim_use.md
  !laesim_wsl_ros_ns3.md
  !css/
  !css/**
  !js/
  !js/**
  !img/
  !img/**
  !stylesheets/
  !stylesheets/laesim.css

remote_branch: gh-pages

theme:
  name: readthedocs
  locale: zh_CN
  include_homepage_in_sidebar: true
  prev_next_buttons_location: bottom
  navigation_depth: 4
  titles_only: false
  sticky_navigation: true
  collapse_navigation: true
  highlightjs: true
  hljs_style: github

extra:
  version: main

extra_css:
  - stylesheets/laesim.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

copyright: LAESim contributors; based on Microsoft AirSim

nav:
  - "首页": index.md
  - "认识 LAESim":
      - "核心特色": laesim_features.md
      - "构建 LAESim": laesim_build.md
      - "使用 LAESim": laesim_use.md
  - "自组织网络":
      - "WSL2、ROS 与 ns-3": laesim_wsl_ros_ns3.md
  - "上游参考":
      - "AirSim 官方文档": https://microsoft.github.io/AirSim/
      - "AirSim API 文档": https://microsoft.github.io/AirSim/apis/
  - "项目":
      - "GitHub 仓库": https://github.com/SANIS-HITSZ/LAESim
      - "提交问题": https://github.com/SANIS-HITSZ/LAESim/issues
      - "更新记录": https://github.com/SANIS-HITSZ/LAESim/blob/main/CHANGELOG.md
