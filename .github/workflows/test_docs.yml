name: Documentation Build & Deploy

# Controls when the action will run.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # AirSim's legacy msgpack-rpc-python dependency requires Python < 3.10.
          python-version: '3.9'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install mkdocs pymdown-extensions    # Mkdocs requirements
          
      - name: Build API reference docs
        run: |
          python3 -m venv .env                            # Virtual env to avoid dep. issues 
          source .env/bin/activate
          pip install Sphinx sphinx_rtd_theme numpy msgpack-rpc-python

          pushd PythonClient >/dev/null
          bash ./build_api_docs.sh
          popd >/dev/null
          mkdir -p docs/api_docs
          cp -r PythonClient/docs/_build/html docs/api_docs/

          deactivate

      - name: Build AirSim Documentation
        run: bash ./build_docs.sh

      # Only on commits to 'main' branch
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build_docs
