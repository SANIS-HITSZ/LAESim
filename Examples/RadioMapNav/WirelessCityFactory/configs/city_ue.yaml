global:
  seed: 20260821
  name: city_ue_project
  output: examples/outputs
city:
  size_m: [240, 240]
  morphology: radial_organic
  building:
    profile: suburban
    coverage_ratio: 0.18
    density_per_km2: 100
    height_distribution: normal
    height_min_m: 8
    height_max_m: 55
    height_mean_m: 20
    height_std_m: 8
    footprint_min_m: [7, 7]
    footprint_max_m: [18, 18]
  roads:
    grid_spacing_m: 60
    width_m: 10
    radial_count: 8
    ring_count: 2
  base_stations:
    placement_family: rooftop_grid
    density_per_km2: 12
    height_m: 30
  task:
    altitude_m: 50
    altitude_range_m: [35, 115]
ue:
  enabled: true
  output_format: ue-ready-bundle
  generate_airsim_settings: true
  import_asset_name: WirelessCity
  # Resolve this relative to the repository root when using --project-root.
  editor_project: unreal/WirelessCityFactory/WirelessCityFactory.uproject
