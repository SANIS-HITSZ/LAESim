global:
  seed: 20260821
  name: city_radio_smoke
  output: SceneGen/outputs
city:
  size_m: [200, 200]
  morphology: manhattan
  building:
    coverage_ratio: 0.12
    density_per_km2: 50
    height_distribution: uniform
    height_min_m: 8
    height_max_m: 30
    footprint_min_m: [8, 8]
    footprint_max_m: [16, 16]
  roads:
    grid_spacing_m: 80
    width_m: 12
  base_stations:
    placement_family: rooftop_grid
    density_per_km2: 8
    height_m: 25
  task:
    altitude_m: 50
    altitude_range_m: [35, 65]
radio:
  enabled: true
  preset: smoke
  # This still requires the native Windows CUDA/OptiX Sionna RT extra.
  # It is intentionally tiny and is not the formal 45M-sample run.
ue:
  enabled: false

